<svg viewBox="0 0 1220 1080" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1220" height="1080" fill="#f2f2f7"/>
  <text x="610" y="34" font-size="20" font-weight="bold" fill="#222" text-anchor="middle">BudgetScala — 4ページ構成のワイヤーフレーム</text>

  <!-- shared nav bar template drawn per-screen -->

  <!-- ===================== Screen 1: ダッシュボード ===================== -->
  <g>
    <rect x="40" y="60" width="540" height="460" rx="10" fill="#ffffff" stroke="#ccc" stroke-width="2"/>
    <rect x="40" y="60" width="540" height="34" fill="#2c3e6b"/>
    <text x="60" y="82" font-size="12" fill="#fff" font-weight="bold">ダッシュボード</text>
    <text x="220" y="82" font-size="11" fill="#9fb0e0">取引一覧</text>
    <text x="310" y="82" font-size="11" fill="#9fb0e0">取引を追加</text>
    <text x="420" y="82" font-size="11" fill="#9fb0e0">カテゴリ</text>
    <rect x="55" y="90" width="80" height="3" fill="#6c8ef5"/>

    <text x="60" y="122" font-size="15" font-weight="bold" fill="#222">ダッシュボード</text>

    <rect x="58" y="136" width="160" height="56" rx="6" fill="#f0f2fa"/>
    <text x="70" y="154" font-size="10" fill="#666">収入合計</text>
    <text x="70" y="176" font-size="16" font-weight="bold" fill="#1b7f3a">¥200,000</text>

    <rect x="226" y="136" width="160" height="56" rx="6" fill="#f0f2fa"/>
    <text x="238" y="154" font-size="10" fill="#666">支出合計</text>
    <text x="238" y="176" font-size="16" font-weight="bold" fill="#c0392b">¥59,000</text>

    <rect x="394" y="136" width="160" height="56" rx="6" fill="#f0f2fa"/>
    <text x="406" y="154" font-size="10" fill="#666">残高</text>
    <text x="406" y="176" font-size="16" font-weight="bold" fill="#222">¥141,000</text>

    <text x="60" y="222" font-size="13" font-weight="bold" fill="#222">カテゴリ別支出</text>

    <text x="60" y="248" font-size="11" fill="#444">食費</text>
    <rect x="130" y="240" width="380" height="10" rx="5" fill="#eee"/>
    <rect x="130" y="240" width="330" height="10" rx="5" fill="#6c8ef5"/>
    <text x="470" y="248" font-size="10" fill="#666" text-anchor="end">¥45,000</text>

    <text x="60" y="272" font-size="11" fill="#444">娯楽</text>
    <rect x="130" y="264" width="380" height="10" rx="5" fill="#eee"/>
    <rect x="130" y="264" width="50" height="10" rx="5" fill="#6c8ef5"/>
    <text x="470" y="272" font-size="10" fill="#666" text-anchor="end">¥6,000</text>

    <text x="60" y="296" font-size="11" fill="#444">交通費</text>
    <rect x="130" y="288" width="380" height="10" rx="5" fill="#eee"/>
    <rect x="130" y="288" width="68" height="10" rx="5" fill="#6c8ef5"/>
    <text x="470" y="296" font-size="10" fill="#666" text-anchor="end">¥8,000</text>
  </g>

  <!-- ===================== Screen 2: 取引一覧 ===================== -->
  <g>
    <rect x="640" y="60" width="540" height="460" rx="10" fill="#ffffff" stroke="#ccc" stroke-width="2"/>
    <rect x="640" y="60" width="540" height="34" fill="#2c3e6b"/>
    <text x="660" y="82" font-size="11" fill="#9fb0e0">ダッシュボード</text>
    <text x="820" y="82" font-size="12" fill="#fff" font-weight="bold">取引一覧</text>
    <text x="910" y="82" font-size="11" fill="#9fb0e0">取引を追加</text>
    <text x="1020" y="82" font-size="11" fill="#9fb0e0">カテゴリ</text>
    <rect x="805" y="90" width="60" height="3" fill="#6c8ef5"/>

    <text x="660" y="122" font-size="15" font-weight="bold" fill="#222">取引一覧</text>

    <g font-size="10" fill="#666" font-weight="bold">
      <text x="660" y="146">日付</text>
      <text x="740" y="146">種別</text>
      <text x="800" y="146">カテゴリ</text>
      <text x="880" y="146">金額</text>
      <text x="960" y="146">メモ</text>
    </g>
    <line x1="660" y1="152" x2="1160" y2="152" stroke="#eee"/>

    <g font-size="11" fill="#333">
      <text x="660" y="174">08/12</text>
      <text x="740" y="174" fill="#c0392b">支出</text>
      <text x="800" y="174">食費</text>
      <text x="880" y="174" fill="#c0392b">-¥3,200</text>
      <text x="960" y="174">スーパー</text>
      <rect x="1120" y="163" width="34" height="16" rx="3" fill="#c0392b"/>
      <text x="1137" y="175" font-size="9" fill="#fff" text-anchor="middle">削除</text>

      <line x1="660" y1="184" x2="1160" y2="184" stroke="#f4f4f4"/>
      <text x="660" y="202">08/10</text>
      <text x="740" y="202" fill="#1b7f3a">収入</text>
      <text x="800" y="202">給与</text>
      <text x="880" y="202" fill="#1b7f3a">¥200,000</text>
      <text x="960" y="202">8月分給与</text>
      <rect x="1120" y="191" width="34" height="16" rx="3" fill="#c0392b"/>
      <text x="1137" y="203" font-size="9" fill="#fff" text-anchor="middle">削除</text>

      <line x1="660" y1="212" x2="1160" y2="212" stroke="#f4f4f4"/>
      <text x="660" y="230">08/05</text>
      <text x="740" y="230" fill="#c0392b">支出</text>
      <text x="800" y="230">交通費</text>
      <text x="880" y="230" fill="#c0392b">-¥8,000</text>
      <text x="960" y="230">定期券</text>
      <rect x="1120" y="219" width="34" height="16" rx="3" fill="#c0392b"/>
      <text x="1137" y="231" font-size="9" fill="#fff" text-anchor="middle">削除</text>
    </g>

    <text x="660" y="270" font-size="10" fill="#999">新しい順に表示。「削除」は確認ダイアログの後にPOSTで削除。</text>
  </g>

  <!-- ===================== Screen 3: 取引を追加 ===================== -->
  <g>
    <rect x="40" y="560" width="540" height="480" rx="10" fill="#ffffff" stroke="#ccc" stroke-width="2"/>
    <rect x="40" y="560" width="540" height="34" fill="#2c3e6b"/>
    <text x="60" y="582" font-size="11" fill="#9fb0e0">ダッシュボード</text>
    <text x="220" y="582" font-size="11" fill="#9fb0e0">取引一覧</text>
    <text x="310" y="582" font-size="12" fill="#fff" font-weight="bold">取引を追加</text>
    <text x="420" y="582" font-size="11" fill="#9fb0e0">カテゴリ</text>
    <rect x="295" y="590" width="76" height="3" fill="#6c8ef5"/>

    <text x="60" y="622" font-size="15" font-weight="bold" fill="#222">取引を追加</text>

    <g font-size="11" fill="#444">
      <text x="60" y="652">日付</text>
      <rect x="60" y="658" width="200" height="28" rx="4" fill="#fafafa" stroke="#ddd"/>
      <text x="70" y="676" fill="#333">2026-08-02</text>

      <text x="60" y="704">種別</text>
      <rect x="60" y="710" width="200" height="28" rx="4" fill="#fafafa" stroke="#ddd"/>
      <text x="70" y="728" fill="#333">支出 ▾</text>

      <text x="60" y="756">金額(円)</text>
      <rect x="60" y="762" width="200" height="28" rx="4" fill="#fafafa" stroke="#ddd"/>
      <text x="70" y="780" fill="#333">1500</text>

      <text x="60" y="808">カテゴリ</text>
      <rect x="60" y="814" width="200" height="28" rx="4" fill="#fafafa" stroke="#ddd"/>
      <text x="70" y="832" fill="#333">食費 ▾</text>

      <text x="60" y="860">メモ(任意)</text>
      <rect x="60" y="866" width="200" height="28" rx="4" fill="#fafafa" stroke="#ddd"/>
      <text x="70" y="884" fill="#333">コンビニ</text>
    </g>

    <rect x="60" y="912" width="80" height="32" rx="5" fill="#2c3e6b"/>
    <text x="100" y="932" font-size="12" fill="#fff" text-anchor="middle">追加</text>
    <text x="160" y="932" font-size="10" fill="#999">POST /transactions/new → 成功時は取引一覧へリダイレクト</text>
  </g>

  <!-- ===================== Screen 4: カテゴリ ===================== -->
  <g>
    <rect x="640" y="560" width="540" height="480" rx="10" fill="#ffffff" stroke="#ccc" stroke-width="2"/>
    <rect x="640" y="560" width="540" height="34" fill="#2c3e6b"/>
    <text x="660" y="582" font-size="11" fill="#9fb0e0">ダッシュボード</text>
    <text x="820" y="582" font-size="11" fill="#9fb0e0">取引一覧</text>
    <text x="910" y="582" font-size="11" fill="#9fb0e0">取引を追加</text>
    <text x="1020" y="582" font-size="12" fill="#fff" font-weight="bold">カテゴリ</text>
    <rect x="1005" y="590" width="55" height="3" fill="#6c8ef5"/>

    <text x="660" y="622" font-size="15" font-weight="bold" fill="#222">カテゴリ</text>

    <g font-size="12" fill="#333">
      <text x="676" y="650">・食費</text>
      <text x="676" y="672">・交通費</text>
      <text x="676" y="694">・娯楽</text>
      <text x="676" y="716">・給与</text>
      <text x="676" y="738">・その他</text>
    </g>

    <text x="660" y="774" font-size="13" font-weight="bold" fill="#222">カテゴリを追加</text>
    <text x="660" y="798" font-size="11" fill="#444">カテゴリ名</text>
    <rect x="660" y="804" width="200" height="28" rx="4" fill="#fafafa" stroke="#ddd"/>
    <text x="670" y="822" fill="#333" font-size="11">書籍</text>

    <rect x="660" y="850" width="80" height="32" rx="5" fill="#2c3e6b"/>
    <text x="700" y="870" font-size="12" fill="#fff" text-anchor="middle">追加</text>
    <text x="760" y="870" font-size="10" fill="#999">POST /categories</text>
  </g>

  <text x="610" y="1064" font-size="11" fill="#999" text-anchor="middle">BudgetScala — 上部ナビゲーション(4リンク)による画面遷移。com.sun.net.httpserverのみでフレームワーク非依存</text>
</svg>
